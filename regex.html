<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Regex Matcher</title>
</head>
<body>

    <h1>Regex Matcher (Mini regex101 Clone)</h1>

    <form method="POST">
        <label><b>Test String:</b></label><br>
        <textarea name="test_string" rows="5" cols="60" required></textarea><br><br>

        <label><b>Regex Pattern:</b></label><br>
        <input type="text" name="regex_pattern" size="40" required><br><br>

        <button type="submit">Submit</button>
    </form>

    <hr>

    {% if error %}
        <p style="color:red;"><b>{{ error }}</b></p>
    {% endif %}

    {% if matches %}
        <h3>Total Matches: {{ count }}</h3>

        <ul>
            {% for match in matches %}
                <li>{{ match }}</li>
            {% endfor %}
        </ul>

    {% elif matches == [] %}
        <p><b>No matches found.</b></p>
    {% endif %}

</body>
</html>
